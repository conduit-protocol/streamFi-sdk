name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 04:00 UTC — runs the E2E browser compatibility job on
    # testnet so PR runs are not blocked by flaky browser runs (#614).
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx vitest --run

  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify dist
        run: node -e "require('./dist/cjs/index.js')"

  e2e-browser:
    name: Browser compatibility (E2E)
    runs-on: ubuntu-latest
    needs: [build]
    # Run E2E only on the nightly schedule or manual dispatch so PR
    # runs are not blocked by flaky browser compat tests (#614).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

      - name: Alert on failure
        if: failure()
        run: |
          echo "::warning::Nightly E2E browser compatibility check failed. See the workflow run for details."
          echo "Investigate tests/browser/compatibility.spec.ts and the Playwright logs."

  react-package:
    name: "@streamfi/react"
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/react/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: packages/react
      - run: npm run typecheck
        working-directory: packages/react
      - run: npx vitest --run
        working-directory: packages/react

  size-check:
    name: Bundle size check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save size-limit@11.2.0 @size-limit/file@11.2.0
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.devDependencies=p.devDependencies||{};p.devDependencies['size-limit']='11.2.0';p.devDependencies['@size-limit/file']='11.2.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npx size-limit
